name: Verifier Integrity Audit

on:
  push:
    branches: [main, editorial-evidence-loader-hotfix-2026-08-22]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate architecture and public integrity surfaces
        run: |
          python - <<'PY'
          import json, pathlib, re

          root = pathlib.Path('.')
          data = json.loads((root / 'data' / 'sources.json').read_text(encoding='utf-8'))
          sources = data.get('sources', [])
          assert data.get('schemaVersion') == 1
          assert len(sources) >= 30, f'Expected at least 30 canonical sources, found {len(sources)}'
          ids = [s.get('id') for s in sources]
          assert all(ids) and len(ids) == len(set(ids)), 'Source IDs must be present and unique'
          homepages = [s.get('homepage') for s in sources if s.get('homepage')]
          feeds = [s.get('feed') for s in sources if s.get('feed')]
          assert all(url.startswith('https://') for url in homepages), 'All source homepages must use HTTPS'
          assert len(feeds) >= 15, f'Expected at least 15 feed-capable sources, found {len(feeds)}'
          assert all(url.startswith('https://') for url in feeds), 'All configured feeds must use HTTPS'

          newsroom = json.loads((root / 'data' / 'verifier-newsroom-directory.json').read_text(encoding='utf-8'))
          assert newsroom.get('schemaVersion') == 1
          newsroom_entries = newsroom.get('entries', [])
          assert len(newsroom_entries) == 22, f'Expected 22 canonical newsroom entries, found {len(newsroom_entries)}'
          newsroom_ids = [entry.get('id') for entry in newsroom_entries]
          newsroom_files = [entry.get('file') for entry in newsroom_entries]
          assert all(newsroom_ids) and len(newsroom_ids) == len(set(newsroom_ids)), 'Newsroom IDs must be present and unique'
          assert all(newsroom_files) and len(newsroom_files) == len(set(newsroom_files)), 'Newsroom files must be present and unique'
          actual_app_files = {p.name for p in (root / 'apps').glob('*.html')}
          assert set(newsroom_files) == actual_app_files, (
              f'Canonical newsroom directory drift: missing={sorted(actual_app_files-set(newsroom_files))}, '
              f'extra={sorted(set(newsroom_files)-actual_app_files)}'
          )
          for entry in newsroom_entries:
              assert (root / 'apps' / entry['file']).exists(), f"Missing newsroom file: {entry['file']}"
              assert entry.get('category'), f"Newsroom entry missing category: {entry.get('id')}"
              assert entry.get('type'), f"Newsroom entry missing type: {entry.get('id')}"
              assert entry.get('maturity'), f"Newsroom entry missing maturity: {entry.get('id')}"

          editorial = json.loads((root / 'data' / 'verifier-editorial-columns.json').read_text(encoding='utf-8'))
          assert editorial.get('schemaVersion') == 1
          editorial_entries = editorial.get('entries', [])
          assert len(editorial_entries) == 18, f'Expected 18 editorial columns, found {len(editorial_entries)}'
          editorial_titles = [entry.get('title') for entry in editorial_entries]
          editorial_files = [entry.get('file') for entry in editorial_entries]
          assert all(editorial_titles) and len(editorial_titles) == len(set(editorial_titles)), 'Editorial titles must be present and unique'
          assert all(editorial_files) and len(editorial_files) == len(set(editorial_files)), 'Editorial files must be present and unique'
          actual_column_files = {p.name for p in (root / 'columns').glob('*.html')}
          assert set(editorial_files) == actual_column_files, (
              f'Editorial columns directory drift: missing={sorted(actual_column_files-set(editorial_files))}, '
              f'extra={sorted(set(editorial_files)-actual_column_files)}'
          )
          for entry in editorial_entries:
              assert entry.get('status') == 'active', f"Editorial column must be active: {entry.get('title')}"
              assert entry.get('beat'), f"Editorial column missing beat: {entry.get('title')}"
              assert entry.get('description'), f"Editorial column missing description: {entry.get('title')}"

                    manifest = json.loads((root / 'mentor-manifest.json').read_text(encoding='utf-8'))
          resource_ids = {r.get('id') for r in manifest.get('resources', [])}
          for required_id in ['daily-top-30','global-source-directory','young-readers-newsroom']:
              assert required_id in resource_ids, f'Mentor manifest missing {required_id}'
          newsroom_by_file = {entry['file']: entry for entry in newsroom_entries}
          for resource in manifest.get('resources', []):
              url = str(resource.get('url') or '')
              if '/apps/' not in url:
                  continue
              file_name = url.split('/apps/', 1)[1].split('#', 1)[0].split('?', 1)[0]
              assert file_name in newsroom_by_file, f"Mentor manifest references newsroom file outside canonical directory: {file_name}"

          required = [
              root / 'assets' / 'verifier-safety.js',
              root / 'assets' / 'verifier-local-cloud.js',
              root / 'assets' / 'verifier-news-data.js',
              root / 'assets' / 'verifier-home-extension.js',
              root / 'assets' / 'verifier-home.css',
              root / 'assets' / 'verifier-home.js',
              root / 'assets' / 'editorial-integrity.js',
              root / 'assets' / 'editorial-evidence-registry.js',
              root / 'data' / 'verifier-newsroom-directory.json',
              root / 'data' / 'verifier-editorial-columns.json',
              root / 'scripts' / 'build_news_feed.py',
              root / '.github' / 'workflows' / 'build-news-feed.yml',
              root / 'editorial_standard_index.html',
              root / 'EDITORIAL_STANDARD.md',
              root / 'EDITORIAL_AUDIT_QUEUE.md',
              root / 'sw.js',
          ]
          for path in required:
              assert path.exists(), f'Missing required file: {path}'

          hardened_pages = [
              root / 'apps' / entry['file']
              for entry in newsroom_entries
              if entry.get('hardened') is True
          ]
          assert hardened_pages, 'No hardened newsroom surfaces declared in canonical newsroom directory'
          for path in hardened_pages:
              text = path.read_text(encoding='utf-8')
              assert 'verifier-safety.js' in text, f'{path} must load shared safety layer'
              assert '<meta name="viewport"' in text, f'{path} missing viewport metadata'
              dangerous = re.findall(r'innerHTML\s*=\s*`[^`]*(?:item|article|it|a|f)\.(?:title|link|description|desc|thumbnail|image)', text, flags=re.S)
              assert not dangerous, f'{path} appears to inject remote feed fields through innerHTML'

          digest = (root / 'apps' / 'daily_digest_index.html').read_text(encoding='utf-8')
          modern = (root / 'apps' / 'Modern_News_Engine_index.html').read_text(encoding='utf-8')
          for label, text in [('Daily Top 30', digest), ('Modern News Engine', modern)]:
              assert 'verifier-news-data.js' in text, f'{label} must use same-origin news data client'
              assert 'api.allorigins.win' not in text, f'{label} must not use AllOrigins directly'
              assert 'api.rss2json.com' not in text, f'{label} must not use rss2json directly'
          assert 'MAX_STORIES=30' in digest and 'MAX_PER_SOURCE=2' in digest
          assert 'Sensitive Content Filter' in modern
          assert 'Kid-Safe:' not in modern

          builder = (root / 'scripts' / 'build_news_feed.py').read_text(encoding='utf-8')
          assert 'data/generated/latest.json' in builder
          assert 'verificationStatus' in builder and 'discovered' in builder
          workflow = (root / '.github' / 'workflows' / 'build-news-feed.yml').read_text(encoding='utf-8')
          assert 'schedule:' in workflow and 'contents: write' in workflow
          assert 'actions/checkout@v7' in workflow and 'actions/setup-python@v7' in workflow
          assert '[skip beta-rollout]' in workflow, 'Generated feed commits must not trigger public HTML rollout'
          assert 'git pull --rebase origin main' in workflow, 'Feed publication must rebase before push'

          interactive = (root / 'apps' / 'interactive_news_index.html').read_text(encoding='utf-8')
          assert 'Spicy / Unusual' not in interactive
          assert 'Kid-Safe:' not in interactive
          assert 'Sensitive Content Filter' in interactive

          kids = (root / 'apps' / 'kids_news_network_index.html').read_text(encoding='utf-8')
          assert 'Young Readers Newsroom' in kids
          assert 'cfgWorker' not in kids and 'Worker URL' not in kids
          assert 'cfgApod' not in kids and 'NASA APOD key' not in kids
          assert 'Kid-Safe:' not in kids

          shell = (root / 'sw.js').read_text(encoding='utf-8')
          assert '/data/generated/' in shell, 'Service worker must explicitly bypass generated current-news data'
          assert 'verifier-news-data.js' in shell, 'Offline shell must cache same-origin news client code'
          assert 'verifier-newsroom-directory.json' in shell, 'Offline shell must consume canonical newsroom directory'
          assert 'offlineEligible === true' in shell, 'Offline shell must derive eligible newsroom pages from manifest metadata'
          offline_entries = [entry for entry in newsroom_entries if entry.get('offlineEligible') is True]
          assert offline_entries, 'Canonical newsroom directory must declare offline-eligible pages'

          home = (root / 'index.html').read_text(encoding='utf-8')
          assert 'verifier-newsroom-directory.json' in home, 'Homepage must consume canonical newsroom directory'
          assert 'verifier-editorial-columns.json' not in home, 'Homepage data loaders must live in the canonical homepage controller'
          assert 'assets/verifier-home.css' in home, 'Homepage must load canonical external stylesheet'
          assert 'assets/verifier-home.js' in home, 'Homepage must load canonical external controller'
          assert '<style' not in home, 'Homepage must not reintroduce inline style ownership'
          assert 'const APPS=[' not in home, 'Homepage must not embed a second newsroom catalog'
          assert 'const COLUMNS=[' not in home, 'Homepage must not embed a second editorial column catalog'
          assert 'const COLUMN_META=Object.freeze' not in home, 'Homepage must not embed a second editorial metadata catalog'

          home_extension = (root / 'assets' / 'verifier-home-extension.js').read_text(encoding='utf-8')
          assert 'APPS' not in home_extension, 'Homepage extension must not mutate canonical newsroom inventory'
          assert 'data-verifier-daily-top30' in home_extension
          assert 'data-verifier-feed-health' in home_extension

          home_controller = (root / 'assets' / 'verifier-home.js').read_text(encoding='utf-8')
          assert 'verifier-newsroom-directory.json' in home_controller, 'Homepage controller must own newsroom directory loading'
          assert 'verifier-editorial-columns.json' in home_controller, 'Homepage controller must own editorial directory loading'
          assert 'const OUTLETS=' not in home_controller, 'Dead OUTLETS catalog must not return'
          assert 'const COLUMNS=[' not in home_controller, 'Homepage controller must not embed editorial columns'

          editorial_layer = (root / 'assets' / 'editorial-integrity.js').read_text(encoding='utf-8')
          assert 'Editorial / Opinion' in editorial_layer
          assert 'editorial_standard_index.html' in editorial_layer
          assert 'VerifierEditorialEvidence' in editorial_layer
          assert 'verifier-evidence-addendum' in editorial_layer
          assert 'safeExternalLink' in editorial_layer
          assert 'ensureEvidenceRegistry' in editorial_layer, 'Editorial integrity layer must self-load evidence registry'
          assert 'editorial-evidence-registry.js' in editorial_layer, 'Self-loader must point to evidence registry asset'
          assert 'document.createElement("script")' in editorial_layer, 'Self-loader must be able to attach evidence registry without HTML mutation'

          evidence = (root / 'assets' / 'editorial-evidence-registry.js').read_text(encoding='utf-8')
          assert 'The Quiet Consensus No One Voted For' in evidence
          assert 'CORRECTION ISSUED' in evidence
          assert 'Criminal allegations withdrawn as factual claims' in evidence
          assert 'Public opinion was overstated' in evidence
          assert 'Statehood language corrected' in evidence
          assert 'https://www.fec.gov/data/committee/C00797670/' in evidence
          assert 'https://www.fec.gov/data/committee/C00799031/' in evidence
          assert 'https://www.pewresearch.org/' in evidence
          assert 'https://news.gallup.com/' in evidence
          assert 'https://digitallibrary.un.org/' in evidence
          urls = re.findall(r'url:\s*"([^"]+)"', evidence)
          assert len(urls) >= 6, 'Priority-A correction should carry a substantive evidence record'
          assert all(url.startswith('https://') for url in urls), 'Editorial evidence links must use HTTPS'

          standard_html = (root / 'editorial_standard_index.html').read_text(encoding='utf-8')
          assert 'Source inclusion is not endorsement' in standard_html
          assert 'Human dignity' in standard_html

          # Public coverage is enforced directly here rather than through a second,
          # separately maintained workflow. Keep one integrity owner.
          public_html = [root / 'index.html', root / 'editorial_standard_index.html']
          public_html += sorted((root / 'apps').glob('*.html'))
          public_html += sorted((root / 'columns').glob('*.html'))
          assert len(public_html) >= 42, f'Expected complete Verifier public HTML inventory, found {len(public_html)}'
          for page in public_html:
              text = page.read_text(encoding='utf-8')
              assert 'vnv-ecosystem-toolbar.js' in text, f'{page} missing official ecosystem toolbar'
          for page in sorted((root / 'columns').glob('*.html')):
              text = page.read_text(encoding='utf-8')
              assert 'editorial-integrity.js' in text, f'{page} missing editorial integrity layer'
              assert 'verifier-typography.css' in text, f'{page} missing Verifier typography layer'

          queue = (root / 'EDITORIAL_AUDIT_QUEUE.md').read_text(encoding='utf-8')
          assert 'The Quiet Consensus No One Voted For' in queue
          assert 'Do not mark an item complete solely because it carries the global Editorial / Opinion banner.' in queue

          print(f'Validated {len(sources)} canonical sources, {len(feeds)} feed-capable sources, {len(newsroom_entries)} canonical newsroom entries, first-party news architecture, editorial correction infrastructure, and single-owner newsroom and editorial-column topology.')
          PY

      - name: Verify local navigation and asset paths
        run: python scripts/test_local_links.py

      - name: Feed URL security regression tests
        run: python -m unittest discover -s scripts -p 'test_feed_security.py' -v

      - name: Published edition client regression tests
        run: node --test scripts/test_news_client.cjs

      - name: Syntax-check Python feed builder
        run: python -m py_compile scripts/build_news_feed.py

      - name: Syntax-check JavaScript assets
        run: |
          node --check assets/verifier-safety.js
          node --check assets/verifier-local-cloud.js
          node --check assets/verifier-news-data.js
          node --check assets/verifier-home-extension.js
          node --check assets/editorial-evidence-registry.js
          node --check assets/editorial-integrity.js
          node --check sw.js

      - name: Syntax-check inline application scripts
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          pages = [
              'apps/live_news_index.html',
              'apps/news_feed_index.html',
              'apps/world_wire_index.html',
              'apps/global_news_digest_index.html',
              'apps/daily_digest_index.html',
              'apps/Modern_News_Engine_index.html',
              'apps/interactive_news_index.html',
              'apps/education_news_index.html',
              'apps/kids_news_network_index.html',
              'apps/Interactive_Live_ News_ Dashboard_index.html',
              'editorial_standard_index.html',
          ]
          pages = sorted(set(pages) | {str(p) for p in pathlib.Path('apps').glob('*.html')} | {'index.html'})
          for page in pages:
              text = pathlib.Path(page).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as fh:
                      fh.write(script)
                      tmp = fh.name
                  result = subprocess.run(['node', '--check', tmp], capture_output=True, text=True)
                  if result.returncode:
                      raise SystemExit(f'{page} inline script {index} failed syntax check:\n{result.stderr}')
              print(f'{page}: {len(scripts)} inline script block(s) checked')
          PY
