name: Verifier Canonical Shell Guardian

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.htm'
      - 'assets/**'
      - '.github/workflows/normalize-vnv-ecosystem-toolbar.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.htm'
      - 'assets/**'
      - '.github/workflows/normalize-vnv-ecosystem-toolbar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit public shell ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          SKIP = {'.git','.github','node_modules','vendor','admin','internal','private','archive','archives','backup','backups','deprecated'}
          PROTECTED = re.compile(r'(^|/)(quiz|quizzes|exam|exams|assessment|assessments)(/|$)', re.I)
          HTML_DOC = re.compile(r'<!doctype\s+html|<html\b|<body\b', re.I)

          patterns = {
              'toolbar': re.compile(r'vnv-ecosystem-toolbar\.js', re.I),
              'header_script': re.compile(r'vnv-header-autopopulate\.js', re.I),
              'header_mount': re.compile(r'VNV_HEADER\.mount\s*\(', re.I),
              'ticker_333': re.compile(r'vnv-333-ticker\.js', re.I),
              'ticker_auto': re.compile(r'vnv-ticker-autopopulate\.js', re.I),
              'external_landing': re.compile(r'vnv-external-landing\.(?:js|css)', re.I),
              'legacy_global_strip': re.compile(r'vnv-global-strip|data-vnv-global-strip', re.I),
              'legacy_beta': re.compile(r'vnv-beta-link\.js|vnvBetaProgramLink|vnvBetaProgramFallback', re.I),
          }

          pages = []
          for p in sorted(set(root.rglob('*.html')) | set(root.rglob('*.htm'))):
              rel = p.as_posix().lstrip('./')
              if {part.lower() for part in p.parts} & SKIP:
                  continue
              if PROTECTED.search('/' + rel):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if not HTML_DOC.search(text):
                  continue
              pages.append((rel, text))

          assert pages, 'No eligible public HTML pages found.'

          failures = []
          coverage = []
          legacy_strip_allowance = {
              'apps/Modern_News_Engine_index.html',
              'apps/global_news_digest_index.html',
              'apps/kids_news_network_index.html',
              'apps/science_news_index.html',
          }
          observed_legacy_strips = set()
          for rel, text in pages:
              counts = {name: len(rx.findall(text)) for name, rx in patterns.items()}
              h1 = len(re.findall(r'<h1\b', text, re.I))
              footer = len(re.findall(r'<footer\b', text, re.I))

              if counts['toolbar'] != 1:
                  failures.append(f'{rel}: expected exactly one official ecosystem toolbar, found {counts["toolbar"]}')
              if counts['external_landing']:
                  failures.append(f'{rel}: obsolete vnv-external-landing surface remains')
              if counts['legacy_global_strip']:
                  observed_legacy_strips.add(rel)
                  if rel not in legacy_strip_allowance:
                      failures.append(f'{rel}: unapproved legacy global strip remains')
              if counts['legacy_beta']:
                  failures.append(f'{rel}: legacy beta utility remains')
              if counts['header_script'] > 1 or counts['header_mount'] > 1:
                  failures.append(f'{rel}: duplicate canonical header ownership')
              if counts['ticker_333'] > 1 or counts['ticker_auto'] > 1:
                  failures.append(f'{rel}: duplicate canonical ticker ownership')
              if bool(counts['ticker_333']) != bool(counts['ticker_auto']):
                  failures.append(f'{rel}: canonical ticker pair is incomplete')
              if h1 > 1:
                  failures.append(f'{rel}: multiple H1 elements ({h1})')
              if footer > 1:
                  failures.append(f'{rel}: multiple footer elements ({footer})')

              coverage.append({
                  'page': rel,
                  'header': counts['header_script'] == 1 and counts['header_mount'] == 1,
                  'tickerPair': counts['ticker_333'] == 1 and counts['ticker_auto'] == 1,
                  'toolbar': counts['toolbar'] == 1,
                  'h1': h1,
                  'footer': footer,
              })

          # Pages already promoted to the canonical shell must never regress.
          promoted = {'index.html', 'apps/world_wire_index.html'}
          by_page = {item['page']: item for item in coverage}
          for rel in promoted:
              item = by_page.get(rel)
              assert item, f'Promoted canonical page missing: {rel}'
              if not item['header']:
                  failures.append(f'{rel}: promoted page lost canonical header')
              if not item['tickerPair']:
                  failures.append(f'{rel}: promoted page lost canonical ticker pair')
              if item['toolbar'] is not True:
                  failures.append(f'{rel}: promoted page lost official toolbar')
              if item['h1'] != 1:
                  failures.append(f'{rel}: promoted page must have exactly one H1')

          stale_allowance = legacy_strip_allowance - observed_legacy_strips
          if stale_allowance:
              failures.append('Remove resolved pages from legacy strip allowance: ' + ', '.join(sorted(stale_allowance)))

          summary = {
              'schema': 'verifier-shell-guardian-v1',
              'eligiblePages': len(coverage),
              'canonicalHeaderPages': sum(1 for x in coverage if x['header']),
              'canonicalTickerPairPages': sum(1 for x in coverage if x['tickerPair']),
              'officialToolbarPages': sum(1 for x in coverage if x['toolbar']),
              'singleH1Pages': sum(1 for x in coverage if x['h1'] == 1),
              'footerPages': sum(1 for x in coverage if x['footer'] == 1),
              'legacyStripAllowance': sorted(legacy_strip_allowance),
              'observedLegacyStrips': sorted(observed_legacy_strips),
              'failures': failures,
          }
          print(json.dumps(summary, indent=2))

          if failures:
              raise SystemExit('\n'.join(failures))

          print('Canonical shell guardian PASS. Legacy pages may still be missing promoted shell pieces, but duplicates and regressions are blocked.')
          PY
