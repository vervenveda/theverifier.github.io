<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Science Daily — News App</title>

<style>
:root {
    --bg: #111;
    --fg: #eee;
    --card: #1c1c1c;
    --accent: #7cf;
}
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--fg);
}

header {
    padding: 16px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    background: #000;
    color: var(--accent);
    letter-spacing: 0.5px;
    position: relative;
}

#toggle {
    position: absolute;
    right: 20px;
    top: 14px;
    cursor: pointer;
    font-size: 22px;
}

.container {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.card {
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 0 12px #0005;
    animation: fade .4s ease;
}

.card h2 {
    margin: 0 0 10px 0;
    font-size: 20px;
    color: var(--accent);
    word-wrap: break-word;
}

.card p {
    margin: 0;
    line-height: 1.5;
    font-size: 15px;
    word-wrap: break-word;
}

.headline {
    padding-bottom: 10px;
    border-bottom: 1px solid #333;
    margin-bottom: 10px;
}

@keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
Science Daily
<div id="toggle">🌙</div>
</header>

<div class="container" id="news"></div>

<script>
/* ---------------------------------------
   THEME TOGGLE
-----------------------------------------*/
const toggle = document.getElementById("toggle");
toggle.addEventListener("click", () => {
    if (document.body.style.background === "white") {
        document.body.style.background = "";
        document.body.style.color = "";
        toggle.textContent = "🌙";
    } else {
        document.body.style.background = "white";
        document.body.style.color = "black";
        toggle.textContent = "☀️";
    }
});

/* Same-origin published news. No third-party proxy or HTML injection. */
const EDITION_URL = "../data/generated/latest.json";
const newsContainer = document.getElementById("news");
let lastWorkingItems = [];
function newsMessage(message){
    newsContainer.replaceChildren();
    const card = document.createElement("div");
    card.className = "card";
    const p = document.createElement("p");
    p.textContent = message;
    card.appendChild(p);
    newsContainer.appendChild(card);
}
function isScience(item){
    const fields = [...(item.topics || []), item.source || "", item.title || ""].join(" ").toLowerCase();
    return /science|research|space|biology|physics|medicine|health|climate|environment|technology/.test(fields);
}
function renderNews(items){
    newsContainer.replaceChildren();
    for(const item of items){
        const card = document.createElement("article");
        card.className = "card";
        const title = document.createElement("h2");
        const link = document.createElement("a");
        link.textContent = String(item.title || "Untitled report");
        link.style.color = "inherit";
        try {
            const url = new URL(item.link);
            if(url.protocol === "https:" && !url.username && !url.password){
                link.href = url.href; link.target = "_blank"; link.rel = "noopener noreferrer";
            }
        } catch (_) {}
        title.append(link);
        const stamp = document.createElement("p");
        stamp.className = "headline";
        stamp.textContent = [item.source, item.pubDate].filter(Boolean).join(" · ");
        const description = document.createElement("p");
        description.textContent = String(item.description || "").slice(0, 420);
        card.append(title, stamp, description);
        newsContainer.appendChild(card);
    }
}
async function loadNews(){
    try {
        const response = await fetch(EDITION_URL, {cache:"no-store"});
        if(!response.ok) throw new Error("Published edition unavailable");
        const data = await response.json();
        if(!Array.isArray(data.stories)) throw new Error("Invalid news edition");
        const items = data.stories.filter(isScience).slice(0, 12);
        if(!items.length) {
            newsMessage("No science stories in this edition. Try the World Wire for more headlines.");
            return;
        }
        lastWorkingItems = items;
        renderNews(items);
    } catch(err) {
        if(lastWorkingItems.length) renderNews(lastWorkingItems);
        else newsMessage("Science news is temporarily unavailable. Please try again later.");
    }
}
loadNews();
setInterval(loadNews, 1000 * 60 * 10);
</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body>
</html>
