<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Verifier — Sovereign World Wire</title>
<meta name="description" content="A global headline wire with source transparency, safe feed rendering, search, and local caching.">
<style>
:root{--paper:#fffcf5;--paper2:#f5ecdd;--ink:#2a2520;--soft:#6f6254;--gold:#c9a667;--nav:#111522;--line:#dac9aa;--card:#fffaf0;--radius:16px;--shadow:0 14px 34px rgba(34,30,26,.12)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(70,80,120,.12),transparent 55%),var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 16px 44px}.mast{text-align:center}.mast h1{font-family:Georgia,serif;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(1.55rem,4vw,2.25rem);margin:0}.mast p{color:var(--soft);margin:.4rem 0}.ticker{margin-top:18px;background:linear-gradient(90deg,#111522,#2b384f);color:white;border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;overflow:hidden}.ticker b{font-size:.72rem;letter-spacing:.12em;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 8px;white-space:nowrap}.ticker a{color:white;text-decoration:none}.ticker-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{margin-top:14px;background:#fff8df;border:1px solid #e5cf91;color:#654c11;border-radius:11px;padding:10px 12px;font-size:.84rem}.controls{display:grid;grid-template-columns:minmax(220px,1fr) 190px auto;gap:9px;margin-top:15px}.controls input,.controls select,.controls button{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fffdf8;color:var(--ink)}.controls button{background:var(--nav);color:#fff;font-weight:750;cursor:pointer}.status{font-size:.78rem;color:var(--soft);margin:9px 2px}.news{display:grid;gap:12px}.article{display:grid;grid-template-columns:150px 1fr;gap:14px;background:linear-gradient(#fffdf8,#f8eddb);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}.img{height:108px;border-radius:12px;background:#d7c7ac;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover;display:block}.source{font-size:.72rem;color:#7c6b55;text-transform:uppercase;letter-spacing:.08em}.article h2{font-family:Georgia,serif;font-size:1.08rem;line-height:1.3;margin:.25rem 0}.article p{font-size:.87rem;color:var(--soft);margin:.35rem 0}.meta{font-size:.75rem;color:#877663}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions a,.actions button{border:1px solid #cbb890;background:#fffaf0;color:#463a2b;border-radius:999px;padding:5px 8px;font-size:.74rem;font-weight:700;text-decoration:none;cursor:pointer}.empty{padding:20px;text-align:center;color:var(--soft)}@media(max-width:700px){.controls{grid-template-columns:1fr}.article{grid-template-columns:1fr}.img{height:180px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="../assets/verifier-safety.js"></script>
</head>
<body>
<div class="wrap">
<header class="mast"><h1>Sovereign World Wire</h1><p>Global headlines · source-first · locally cached</p><p id="date"></p></header>
<section class="ticker"><b>LIVE FEED</b><div class="ticker-text" id="ticker">Checking current reporting…</div></section>
<div class="notice"><strong>Important:</strong> “Live” describes feed freshness, not factual certification. The Verifier preserves source attribution and gives readers direct access to originals and comparison tools.</div>
<section class="controls"><input id="search" type="search" placeholder="Search by keyword or source…" aria-label="Search world wire"><select id="category"><option value="all">All categories</option></select><button id="refresh" type="button">Refresh Wire</button></section>
<div class="status" id="status">Starting…</div>
<section class="news" id="news" aria-live="polite"></section>
</div>
<script>
(() => {
"use strict";
const S=window.VerifierSafety;if(!S)return;const $=id=>document.getElementById(id);const store=S.safeStorage("verifier-world-wire-v3");
const SOURCES=[
 {name:"BBC World",category:"World",url:"https://feeds.bbci.co.uk/news/world/rss.xml"},
 {name:"The Guardian World",category:"World",url:"https://www.theguardian.com/world/rss"},
 {name:"Al Jazeera",category:"World",url:"https://www.aljazeera.com/xml/rss/all.xml"},
 {name:"NPR",category:"Culture & U.S.",url:"https://feeds.npr.org/1001/rss.xml"},
 {name:"Financial Times",category:"Business",url:"https://www.ft.com/?format=rss"},
 {name:"BBC Science & Environment",category:"Environment",url:"https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"},
 {name:"France 24 English",category:"World",url:"https://www.france24.com/en/rss"},
 {name:"Electronic Frontier Foundation",category:"Rights & Technology",url:"https://www.eff.org/rss.xml"}
];
let articles=[],tickerIndex=0,tickerTimer=null;
$("date").textContent="Edition for "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
[...new Set(SOURCES.map(x=>x.category))].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;$("category").append(o)});
async function fetchText(url,timeout=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text()}finally{clearTimeout(t)}}
function xmlItems(raw,src){const doc=new DOMParser().parseFromString(raw,"text/xml");if(doc.querySelector("parsererror"))throw new Error("Invalid XML");let nodes=[...doc.querySelectorAll("item")],atom=false;if(!nodes.length){nodes=[...doc.querySelectorAll("entry")];atom=true}return nodes.slice(0,10).map(n=>{let href="";if(atom){const l=n.querySelector("link[rel='alternate']")||n.querySelector("link");href=l?.getAttribute("href")||""}else href=n.querySelector("link")?.textContent||"";const image=n.querySelector("enclosure[url]")?.getAttribute("url")||"";return S.normalizeArticle({title:n.querySelector("title")?.textContent,link:href,description:n.querySelector("description")?.textContent||n.querySelector("summary")?.textContent,pubDate:n.querySelector("pubDate")?.textContent||n.querySelector("published")?.textContent||n.querySelector("updated")?.textContent,image},{name:src.name,category:src.category})})}
async function fetchSource(src){try{return xmlItems(await fetchText("https://api.allorigins.win/raw?url="+encodeURIComponent(src.url)),src)}catch(e){try{const data=JSON.parse(await fetchText("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(src.url)));return Array.isArray(data.items)?data.items.slice(0,10).map(x=>S.normalizeArticle(x,{name:src.name,category:src.category})):[]}catch(e2){console.warn("Wire source unavailable",src.name,e,e2);return[]}}}
function ms(a){const n=Date.parse(a.pubDate||"");return Number.isFinite(n)?n:0}function visible(){const q=$("search").value.trim().toLowerCase(),cat=$("category").value;return articles.filter(a=>(cat==="all"||a.category===cat)&&(!q||`${a.title} ${a.description} ${a.source}`.toLowerCase().includes(q))).sort((a,b)=>ms(b)-ms(a))}
function external(label,url){const a=document.createElement("a");a.textContent=label;return S.externalLink(a,url)?a:null}
function card(a){const article=document.createElement("article");article.className="article";const imgWrap=document.createElement("div");imgWrap.className="img";if(a.image){const img=document.createElement("img");img.alt="";S.image(img,a.image);imgWrap.append(img)}const body=document.createElement("div");const source=document.createElement("div");source.className="source";source.textContent=`${a.source} · ${a.category}`;const h=document.createElement("h2");h.textContent=a.title;const meta=document.createElement("div");meta.className="meta";meta.textContent=a.pubDate?new Date(a.pubDate).toLocaleString():"Undated";const p=document.createElement("p");p.textContent=(a.description||"No summary supplied by the source.").slice(0,420);const actions=document.createElement("div");actions.className="actions";const open=external("Open original ↗",a.link);if(open)actions.append(open);const compare=external("Compare coverage ↗",`https://news.google.com/search?q=${encodeURIComponent(`"${a.title}"`)}`);if(compare)actions.append(compare);const archive=external("Archive ↗",`https://web.archive.org/web/*/${encodeURIComponent(a.link)}`);if(archive)actions.append(archive);body.append(source,h,meta,p,actions);article.append(imgWrap,body);return article}
function render(){const list=visible();const root=$("news");root.replaceChildren();if(!list.length){const d=document.createElement("div");d.className="empty";d.textContent="No articles match the current filters.";root.append(d)}else list.forEach(a=>root.append(card(a)));$("status").textContent=`${list.length} shown · ${articles.length} loaded`;startTicker(list)}
function startTicker(list){if(tickerTimer)clearInterval(tickerTimer);tickerIndex=0;if(!list.length){$("ticker").textContent="No current headlines available.";return}const show=()=>{const a=list[tickerIndex%Math.min(list.length,12)];$("ticker").replaceChildren();const link=external(`${a.source} · ${a.title}`,a.link);if(link)$("ticker").append(link);else $("ticker").textContent=`${a.source} · ${a.title}`;tickerIndex++};show();tickerTimer=setInterval(show,8000)}
async function load(force=false){const cache=store.get("cache",null);if(!force&&cache?.items?.length){articles=cache.items.map(x=>S.normalizeArticle(x,{name:x.source,category:x.category}));$("status").textContent="Showing local cache while refreshing…";render()}const results=await Promise.allSettled(SOURCES.map(fetchSource));const fresh=results.flatMap(r=>r.status==="fulfilled"?r.value:[]);if(fresh.length){const seen=new Set();articles=fresh.filter(a=>{const k=`${a.link}::${a.title}`;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>ms(b)-ms(a));store.set("cache",{savedAt:Date.now(),items:articles});$("status").textContent=`Wire refreshed ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`;render()}else if(cache?.items?.length){$("status").textContent="Network feeds unavailable · local cache retained"}else{articles=[];$("status").textContent="Network feeds unavailable";render()}}
$("search").addEventListener("input",render);$("category").addEventListener("change",render);$("refresh").addEventListener("click",()=>load(true));load(false);setInterval(()=>load(true),60*60*1000);
})();
</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body>
</html>
